<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社群貼文工作台</title>
  <style>
    :root {
      --淡黃色: #F7E6A1;
      --白色: #FFFFFF;
      --淺粉色: #F8D7DC;
      --奶油底: #FFFDF7;
      --墨黑: #34333A;
      --淡灰: #ECE8E0;
      --粉紅深: #D96D8A;
      --陰影: 0 18px 45px rgba(104, 86, 58, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1180px;
      background: var(--奶油底);
      color: var(--墨黑);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    button, input, textarea { font: inherit; }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px clamp(20px, 4vw, 56px);
      background: var(--淡黃色);
      border-bottom: 2px solid rgba(52, 51, 58, 0.12);
    }

    .brand-lockup { display: flex; align-items: center; gap: 14px; }

    .mascot {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--白色);
      border: 2px solid var(--墨黑);
      border-radius: 14px 14px 14px 5px;
      font-size: 22px;
      transform: rotate(-4deg);
    }

    .topbar h1 { margin: 0; font-size: clamp(20px, 2.5vw, 30px); letter-spacing: 0.03em; }
    .account { margin: 3px 0 0; font-size: 13px; opacity: 0.7; }
    .top-note {
      padding: 8px 12px;
      border: 1px solid rgba(52, 51, 58, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      white-space: nowrap;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .action-button {
      border: 1.5px solid var(--墨黑);
      border-radius: 999px;
      background: var(--白色);
      color: var(--墨黑);
      padding: 9px 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }
    .action-button:hover { background: var(--淺粉色); }
    .top-actions .action-button {
      border: 1px solid rgba(52, 51, 58, 0.5);
      border-radius: 999px;
      background: #E5E1DD;
      padding: 7px 12px;
      font-size: 13px;
      white-space: nowrap;
    }
    .top-actions .action-button:hover { background: #D6D1CA; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(310px, 1.02fr) minmax(370px, 1.16fr) minmax(300px, 0.82fr);
      gap: 20px;
      max-width: 1640px;
      min-width: 1180px;
      margin: 0 auto;
      padding: 28px clamp(20px, 4vw, 56px) 46px;
    }

    .panel {
      min-width: 0;
      background: var(--白色);
      border: 1px solid var(--淡灰);
      border-radius: 22px;
      box-shadow: var(--陰影);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      padding: 18px 20px 14px;
      border-bottom: 1px dashed var(--淡灰);
      font-size: 18px;
    }

    .panel-title small { font-size: 12px; font-weight: 500; color: #77737A; }

    .material-form { padding: 18px 20px 22px; }
    .material-actions { padding: 0 20px 22px; }
    .compose-prompt-button { width: 100%; }

    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    .field label { font-size: 14px; font-weight: 800; }
    .required { color: var(--粉紅深); font-size: 12px; }

    .field input, .field textarea {
      width: 100%;
      border: 1.5px solid #DED8CB;
      border-radius: 12px;
      background: #FFFDFC;
      color: var(--墨黑);
      outline: none;
      line-height: 1.55;
      padding: 11px 12px;
      resize: vertical;
    }

    .field textarea { min-height: 86px; }
    .field textarea.tall { min-height: 155px; }
    .field input:focus, .field textarea:focus {
      border-color: var(--粉紅深);
      box-shadow: 0 0 0 4px rgba(217, 109, 138, 0.13);
    }
    ::placeholder { color: #A49EA1; opacity: 1; }

    .composer { display: grid; grid-template-rows: auto auto 1fr; min-height: 610px; overflow: hidden; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 20px 2px; }
    .tab {
      min-width: 92px;
      border: 1px solid #DED8CB;
      border-radius: 999px;
      background: #FFFDFC;
      color: var(--墨黑);
      padding: 9px 16px;
      cursor: default;
      font-weight: 800;
    }
    .tab.active { background: var(--淡黃色); border-color: var(--墨黑); }

    .composer-body { display: grid; align-content: start; gap: 7px; padding: 0 20px 20px; }
    .composer-label { font-size: 14px; font-weight: 800; }
    .character-count { min-height: 20px; margin: 0; color: #77737A; font-size: 12px; font-weight: 700; text-align: right; }
    .character-count.over-limit { color: #C63D5B; }
    #post-content {
      height: 430px;
      min-height: 430px;
      border: 1.5px solid #DED8CB;
      border-radius: 16px;
      padding: 16px;
      resize: none;
      outline: none;
      line-height: 1.85;
      color: var(--墨黑);
      background:
        linear-gradient(#fffdfc 31px, #f0ede6 32px);
      background-size: 100% 32px;
    }
    #post-content:focus { border-color: var(--粉紅深); box-shadow: 0 0 0 4px rgba(217, 109, 138, 0.13); }

    .preview-panel { display: grid; place-items: center; align-content: start; padding: 28px 18px; min-height: 610px; background: linear-gradient(145deg, #FFF8F9, var(--白色)); }
    .preview-label { align-self: start; width: 100%; margin: 0 0 22px; text-align: center; font-size: 14px; font-weight: 800; }

    .phone {
      position: relative;
      width: min(100%, 292px);
      min-height: 525px;
      overflow: hidden;
      border: 8px solid var(--墨黑);
      border-radius: 36px;
      background: var(--白色);
      box-shadow: 11px 12px 0 var(--淡黃色), 0 15px 32px rgba(52, 51, 58, 0.18);
    }
    .phone-notch { width: 92px; height: 20px; margin: 0 auto; border-radius: 0 0 14px 14px; background: var(--墨黑); }
    .phone-header { display: flex; align-items: center; gap: 8px; padding: 15px 15px 11px; border-bottom: 1px solid var(--淡灰); }
    .avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--淺粉色); font-size: 16px; }
    .phone-account { font-size: 12px; font-weight: 800; }
    .phone-account span { display: block; margin-top: 2px; color: #817B82; font-size: 10px; font-weight: 500; }
    .preview-art { height: 166px; display: grid; place-items: center; margin: 0 13px; overflow: hidden; border-radius: 14px; background: linear-gradient(135deg, var(--淡黃色), var(--淺粉色)); font-size: 52px; }
    .preview-art img { width: 100%; height: 100%; object-fit: cover; }
    .preview-copy { max-height: 214px; overflow: auto; padding: 13px 15px 54px; font-size: 12px; line-height: 1.7; color: #77737A; white-space: pre-wrap; }
    .empty-copy { color: #A49EA1; }
    .phone-footer { position: absolute; right: 0; bottom: 0; left: 0; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--淡灰); background: rgba(255,255,255,.94); font-size: 17px; }
    .upload-box { width: min(100%, 292px); margin-top: 24px; }
    .upload-box label { display: grid; gap: 7px; font-size: 13px; font-weight: 800; }
    .upload-box input { width: 100%; padding: 9px; border: 1px dashed var(--粉紅深); border-radius: 11px; background: var(--白色); color: var(--墨黑); font-size: 12px; }
    .social-preview { min-height: 500px; padding: 14px; background: var(--白色); }
    .social-header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .social-avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--淺粉色); font-size: 16px; }
    .social-name { color: var(--墨黑); font-size: 12px; font-weight: 800; }
    .social-meta { margin-top: 2px; color: #969097; font-size: 10px; }
    .social-text { margin: 0 0 12px; color: var(--墨黑); font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .hint { color: #A49EA1 !important; }
    .platform-image { position: relative; display: grid; place-items: center; overflow: hidden; background: #F0EEEA; color: #9F99A0; font-size: 12px; }
    .platform-image img { width: 100%; height: 100%; object-fit: cover; }
    .fb-image { min-height: 160px; height: auto; border-radius: 4px; }
    .fb-image img { height: auto; object-fit: contain; }
    .ig-image { aspect-ratio: 1; border-radius: 0; background: linear-gradient(135deg, var(--淡黃色), var(--淺粉色)); }
    .ig-image img { object-fit: contain; }
    .ig-image-title { position: absolute; inset: 14px; display: grid; place-items: center; text-align: center; color: var(--墨黑); font-size: 23px; font-weight: 900; line-height: 1.35; text-shadow: 0 1px rgba(255,255,255,.72); word-break: break-word; }
    .fb-actions, .ig-actions { display: flex; gap: 18px; padding: 11px 2px; border-bottom: 1px solid var(--淡灰); color: #636066; font-size: 12px; font-weight: 700; }
    .fb-more-button { margin: -7px 0 11px; border: 0; background: transparent; color: #5D6470; cursor: pointer; font-size: 12px; font-weight: 800; padding: 0; }
    .fb-more-button:hover { text-decoration: underline; }
    .ig-actions { border-bottom: 0; padding: 11px 1px 9px; color: var(--墨黑); font-size: 19px; }
    .ig-caption { margin-top: 2px; }
    .line-screen { min-height: 500px; background: #DDF2FA; }
    .line-message { display: flex; align-items: flex-start; gap: 9px; }
    .line-message-content { display: grid; gap: 4px; }
    .line-bubble { max-width: 214px; padding: 11px 12px; border-radius: 4px 15px 15px 15px; background: var(--白色); color: var(--墨黑); font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .line-time { color: #74909A; font-size: 10px; }
    .thread-post { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; padding: 4px 1px; }
    .thread-post .social-avatar { width: 42px; height: 42px; background: #E5E1DD; font-size: 20px; }
    .thread-main { min-width: 0; }
    .thread-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .thread-author { display: flex; align-items: baseline; min-width: 0; gap: 5px; }
    .thread-name { overflow: hidden; margin: 0; color: var(--墨黑); font-size: 14px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .thread-time { flex: 0 0 auto; color: #969097; font-size: 12px; font-weight: 700; }
    .thread-logo { flex: 0 0 auto; color: var(--墨黑); font-family: Arial, sans-serif; font-size: 28px; font-weight: 900; line-height: 0.72; letter-spacing: -0.18em; transform: rotate(-8deg); }
    .thread-post .social-text { margin: 8px 0 0; font-size: 15px; line-height: 1.65; }
    .thread-actions { display: flex; align-items: center; gap: 20px; margin-top: 17px; color: var(--墨黑); }
    .thread-action { display: inline-grid; place-items: center; width: 23px; height: 23px; font-family: Arial, sans-serif; font-size: 25px; font-weight: 400; line-height: 1; }
    .thread-action.repost { font-size: 29px; transform: rotate(12deg); }
    .thread-action.share { font-size: 27px; transform: rotate(-21deg); }

    .modal-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(52, 51, 58, 0.42);
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      width: min(100%, 720px);
      max-height: min(82vh, 780px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 2px solid var(--墨黑);
      border-radius: 22px;
      background: var(--白色);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px dashed var(--淡灰); }
    .modal-title { margin: 0; font-size: 20px; }
    .icon-button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--墨黑); cursor: pointer; font-size: 24px; line-height: 1; }
    .icon-button:hover { background: var(--淡灰); }
    .modal-body { display: grid; gap: 16px; overflow: auto; padding: 20px; }
    .modal-field { display: grid; gap: 8px; font-size: 14px; font-weight: 800; }
    .modal-field textarea, .prompt-output {
      width: 100%;
      min-height: 180px;
      border: 1.5px solid #DED8CB;
      border-radius: 12px;
      padding: 12px;
      resize: vertical;
      color: var(--墨黑);
      background: #FFFDFC;
      line-height: 1.65;
    }
    .prompt-output { min-height: 360px; resize: none; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px 20px; border-top: 1px dashed var(--淡灰); }
    .primary-button { background: var(--淡黃色); }
    .copy-status { align-self: center; margin-right: auto; color: #5D775B; font-size: 13px; font-weight: 800; }
    .ai-response-input { min-height: 320px; }
    .import-status { align-self: center; margin-right: auto; color: #5D775B; font-size: 13px; font-weight: 800; }
    .import-questions { margin: 0; padding: 13px; border: 1px solid var(--淡灰); border-radius: 12px; background: #FFFDF7; color: var(--墨黑); font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
    .emoji-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 13px 20px; border-bottom: 1px dashed var(--淡灰); background: #FFFDF9; }
    .emoji-picker-label { margin-right: 2px; font-size: 12px; font-weight: 800; color: #77737A; }
    .emoji-button { width: 31px; height: 31px; border: 1px solid #DED8CB; border-radius: 9px; background: var(--白色); cursor: pointer; font-size: 17px; line-height: 1; }
    .emoji-button:hover { border-color: var(--粉紅深); background: var(--淺粉色); transform: translateY(-1px); }
    .emoji-status { flex-basis: 100%; min-height: 16px; color: #77737A; font-size: 11px; }
    .saved-post-list { align-content: start; }
    .saved-post-empty { margin: 12px 0; color: #77737A; text-align: center; }
    .saved-post-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--淡灰); border-radius: 14px; background: #FFFDFC; }
    .saved-post-name { overflow: hidden; font-size: 14px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .saved-post-time { margin-top: 4px; color: #77737A; font-size: 12px; }
    .saved-post-actions { display: flex; gap: 8px; }
    .small-button { padding: 7px 11px; font-size: 12px; }
    .delete-button { border-color: var(--粉紅深); color: #A84261; }
    .modal.kanban-modal { width: min(100%, 1160px); }
    .kanban-board { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 14px; background: #FFFDF9; }
    .kanban-column { min-height: 350px; padding: 12px; border: 1px solid var(--淡灰); border-radius: 16px; background: var(--白色); }
    .kanban-column-title { margin: 0 0 10px; font-size: 15px; }
    .kanban-cards { display: grid; gap: 10px; }
    .kanban-card { display: grid; gap: 10px; padding: 12px; border: 1px solid #DED8CB; border-radius: 12px; background: #FFFDFC; }
    .kanban-card-name { overflow: hidden; font-size: 13px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .kanban-card-meta { color: #77737A; font-size: 11px; }
    .kanban-card-actions { display: flex; align-items: center; gap: 8px; }
    .status-select { min-width: 0; flex: 1; border: 1px solid #DED8CB; border-radius: 8px; padding: 6px; background: var(--白色); color: var(--墨黑); font-size: 12px; }
    .kanban-empty { margin: 20px 0; color: #A49EA1; font-size: 12px; text-align: center; }

    @media (max-width: 760px) {
      body { min-width: 0; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 12px; padding: 14px 16px; }
      .top-actions { width: 100%; flex-wrap: wrap; gap: 8px; }
      .top-note { width: 100%; white-space: normal; }
      .workspace {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        min-width: 0;
        margin: 0;
        padding: 16px;
      }
      .composer, .preview-panel { min-height: 0; }
      .preview-panel { padding: 22px 16px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: rise 0.45s ease both; }
      .panel:nth-child(2) { animation-delay: 0.06s; }
      .panel:nth-child(3) { animation-delay: 0.12s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <div class="mascot" aria-hidden="true">🧸</div>
      <div>
        <h1 id="page-title">❓待補｜社群工作台</h1>
      </div>
    </div>
    <div class="top-actions">
      <div class="top-note">先整理素材，再開始寫貼文</div>
      <button id="kanban-button" class="action-button" type="button">🗂 進度看板</button>
      <button id="saved-posts-button" class="action-button" type="button">📁 我的貼文</button>
      <button id="new-post-button" class="action-button" type="button">＋ 新的一篇</button>
      <button id="settings-button" class="action-button" type="button">⚙ 設定</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel" aria-labelledby="material-title">
      <h2 id="material-title" class="panel-title">素材卡 <small>先填已確認資訊</small></h2>
      <div class="emoji-picker" aria-label="常用 Emoji">
        <span class="emoji-picker-label">常用 Emoji</span>
        <button class="emoji-button" type="button" data-emoji="🧸" aria-label="插入 🧸">🧸</button>
        <button class="emoji-button" type="button" data-emoji="✨" aria-label="插入 ✨">✨</button>
        <button class="emoji-button" type="button" data-emoji="🩷" aria-label="插入 🩷">🩷</button>
        <button class="emoji-button" type="button" data-emoji="🎃" aria-label="插入 🎃">🎃</button>
        <button class="emoji-button" type="button" data-emoji="👻" aria-label="插入 👻">👻</button>
        <button class="emoji-button" type="button" data-emoji="🎁" aria-label="插入 🎁">🎁</button>
        <button class="emoji-button" type="button" data-emoji="📦" aria-label="插入 📦">📦</button>
        <button class="emoji-button" type="button" data-emoji="🛍️" aria-label="插入 🛍️">🛍️</button>
        <button class="emoji-button" type="button" data-emoji="🔥" aria-label="插入 🔥">🔥</button>
        <button class="emoji-button" type="button" data-emoji="🔗" aria-label="插入 🔗">🔗</button>
        <button class="emoji-button" type="button" data-emoji="✅" aria-label="插入 ✅">✅</button>
        <span id="emoji-status" class="emoji-status" aria-live="polite">先點選素材欄位，再點 Emoji 插入。</span>
      </div>
      <form class="material-form">
        <div class="field">
          <label for="item-name">品項名稱 <span class="required">必填</span></label>
          <input id="item-name" type="text" placeholder="例：我們熱銷破500個的小樽前開式行李箱，出 2.0版本了！🧳✨">
        </div>
        <div class="field">
          <label for="appeal">吸引人購買的說明 <span class="required">必填</span></label>
          <textarea id="appeal" placeholder="例：這一款第一眼真的超可愛😻🩷🩷 外型就像一台「小冰箱」，方方正正、簡約又有質感，而且不是只有好看而已，收納＆實用度也一起升級！"></textarea>
        </div>
        <div class="field">
          <label for="features">詳細功能介紹 <span class="required">必填</span></label>
          <textarea id="features" class="tall" placeholder="例：✅ 1:9 前開式設計 免整咖攤平，狹小房間也能輕鬆整理&#10;✅ 20／26／30 吋三尺寸 依旅程選擇，箱裝箱堆疊更省空間&#10;✅ ABS＋PC 頂規箱體 搭配金屬邊角防撞，耐用更有質感&#10;✅ 箱底小凹槽設計 高處拿取省力，行李平台搬運更方便&#10;✅ 26／30 吋五輪避震彈簧煞車 推行更穩，斜坡放置不滑動&#10;✅ YKK 拉鍊＋一拉擴充 容量隨手放大，戰利品再多也不怕&#10;✅ 分區收納設計 側束帶＋下壓式束帶，衣物用品整齊不亂&#10;✅ 立體掛扣腳座 袋子、購物袋隨手掛，旅途更便利&#10;✅ 後置飲料杯架 候機排隊解放雙手，飲料隨放隨拿🥤"></textarea>
        </div>
        <div class="field">

        <h2 id="kanban-modal-title" class="modal-title">🗂 一週貼文進度看板</h2>
        <button class="icon-button" type="button" data-close-modal="kanban-modal" aria-label="關閉進度看板">×</button>

  <script>
    // ===== 可自行修改的品牌設定 =====
    const BRAND = {
      name: "想想熊選物專賣店",
      account: "❓待補",
      colors: {
        paleYellow: "#F7E6A1",
        white: "#FFFFFF",
        lightPink: "#F8D7DC"
      },
      platforms: ["Facebook", "Instagram", "LINE 官方帳號", "Threads"]
    };

    // ===== 可自行修改的素材卡欄位 =====
    const MATERIAL_FIELDS = [
      { id: "item-name", label: "品項名稱", required: true },
      { id: "appeal", label: "吸引人購買的說明", required: true },
      { id: "features", label: "詳細功能介紹", required: true },
      { id: "recommend", label: "再次推薦購買理由", required: false },
      { id: "price", label: "價格", required: false },
      { id: "date", label: "日期", required: true },
      { id: "stock", label: "有無現貨或是要預購", required: true },
      { id: "comment-cta", label: "留言「??」傳連結給您", required: true },
      { id: "address", label: "地址", required: true }
    ];

    document.title = BRAND.name + "｜社群工作台";
    document.getElementById("page-title").textContent = BRAND.name + " v2｜社群工作台";
    const accountName = document.getElementById("account-name");
    if (accountName) accountName.textContent = "Instagram：" + BRAND.account;
    const tabs = document.getElementById("platform-tabs");
    const postContent = document.getElementById("post-content");
    const characterCount = document.getElementById("character-count");
    const socialPreview = document.getElementById("social-preview");
    const imageUpload = document.getElementById("image-upload");
    const settingsButton = document.getElementById("settings-button");
    const settingsModal = document.getElementById("settings-modal");
    const promptModal = document.getElementById("prompt-modal");
    const aiImportModal = document.getElementById("ai-import-modal");
    const brandGuidelines = document.getElementById("brand-guidelines");
    const checklist = document.getElementById("checklist");
    const promptOutput = document.getElementById("prompt-output");
    const copyStatus = document.getElementById("copy-status");
    const aiImportButton = document.getElementById("ai-import-button");
    const aiResponseInput = document.getElementById("ai-response-input");
    const aiImportStatus = document.getElementById("ai-import-status");
    const aiImportQuestions = document.getElementById("ai-import-questions");
    const SETTINGS_STORAGE_KEY = "social-workbench-settings";
    const MAX_CHARACTERS_BY_PLATFORM = { Instagram: 216 };
    const SAVED_POSTS_STORAGE_KEY = "social-workbench-saved-posts";
    const DRAFT_STORAGE_KEY = "social-workbench-draft";
    const POST_STATUSES = ["草稿", "等老闆確認", "完成"];
    const kanbanButton = document.getElementById("kanban-button");
    const kanbanModal = document.getElementById("kanban-modal");
    const kanbanBoard = document.getElementById("kanban-board");
    const savedPostsButton = document.getElementById("saved-posts-button");
    const newPostButton = document.getElementById("new-post-button");
    const savePostButton = document.getElementById("save-post-button");
    const savedPostsModal = document.getElementById("saved-posts-modal");
    const savedPostsList = document.getElementById("saved-posts-list");
    const emojiStatus = document.getElementById("emoji-status");
    let activePlatform = BRAND.platforms[0];
    let imageDataUrl = "";
    let currentPostId = null;
    let currentPostStatus = "草稿";
    let activeMaterialInput = null;
    let facebookPreviewExpanded = false;
    const postByPlatform = Object.fromEntries(BRAND.platforms.map((platform) => [platform, ""]));
    const userEdited = Object.fromEntries(BRAND.platforms.map((platform) => [platform, false]));

    function valueOf(id) {
      return document.getElementById(id).value.trim();
    }

    function updateCharacterCount() {
      const count = [...postContent.value].length;
      const limit = MAX_CHARACTERS_BY_PLATFORM[activePlatform];
      const isOverLimit = Boolean(limit && count > limit);
      characterCount.classList.toggle("over-limit", isOverLimit);
      characterCount.textContent = limit
        ? `字數：${count} / ${limit}${isOverLimit ? "（超過了）" : ""}`
        : `字數：${count}`;
    }

    function dateText() {
      const date = valueOf("date");
      return date ? "📅 " + date.replaceAll("-", "/") : "";
    }

    function formattedDateWithWeekday(value) {
      if (!value) return "";
      const [year, month, day] = value.split("-").map(Number);
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      return `${year}/${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}（${weekdays[new Date(year, month - 1, day).getDay()]}）`;
    }

    function openModal(modal) {
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(modal) {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "{}");
        brandGuidelines.value = saved.brandGuidelines || "";
        checklist.value = saved.checklist || "";
      } catch {
        brandGuidelines.value = "";
        checklist.value = "";
      }
    }

    function getCurrentState() {
      postByPlatform[activePlatform] = postContent.value;
      return {
        material: Object.fromEntries(MATERIAL_FIELDS.map(({ id }) => [id, document.getElementById(id).value])),
        posts: { ...postByPlatform },
        userEdited: { ...userEdited },
        activePlatform
      };
    }

    function saveDraft() {
      try {
        localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify({
          currentPostId,
          status: currentPostStatus,
          state: getCurrentState()
        }));
      } catch {
        // 草稿暫存失敗時，仍保留目前畫面的編輯內容。
      }
    }

    function restoreState(state) {
      if (!state || typeof state !== "object") return false;
      MATERIAL_FIELDS.forEach(({ id }) => {
        document.getElementById(id).value = state.material?.[id] || "";
      });
      BRAND.platforms.forEach((platform) => {
        postByPlatform[platform] = state.posts?.[platform] || "";
        userEdited[platform] = Boolean(state.userEdited?.[platform]);
      });
      const restoredPlatform = BRAND.platforms.includes(state.activePlatform) ? state.activePlatform : BRAND.platforms[0];
      activePlatform = BRAND.platforms[0];
      setActivePlatform(restoredPlatform, false, false);
      renderPreview();
      return true;
    }

    function loadDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "null");
        if (!draft?.state || !restoreState(draft.state)) return false;
        currentPostId = draft.currentPostId || null;
        currentPostStatus = POST_STATUSES.includes(draft.status) ? draft.status : "草稿";
        return true;
      } catch {
        return false;
      }
    }

    function loadSavedPosts() {
      try {
        const savedPosts = JSON.parse(localStorage.getItem(SAVED_POSTS_STORAGE_KEY) || "[]");
        return Array.isArray(savedPosts) ? savedPosts : [];
      } catch {
        return [];
      }
    }

    function saveSavedPosts(posts) {
      localStorage.setItem(SAVED_POSTS_STORAGE_KEY, JSON.stringify(posts));
    }

    function savedPostName(state) {
      const date = state.material?.date || "未填日期";
      const item = (state.material?.["item-name"] || "未命名素材").trim() || "未命名素材";
      return `${date}＋${item}`;
    }

    function formatSavedTime(value) {
      return new Intl.DateTimeFormat("zh-TW", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));
    }

    function makePostId() {
      return globalThis.crypto?.randomUUID?.() || `post-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function postStatus(value) {
      return POST_STATUSES.includes(value) ? value : "草稿";
    }

    function hasDraftContent() {
      const state = getCurrentState();
      return Object.values(state.material).some((value) => value.trim()) || Object.values(state.posts).some((value) => value.trim());
    }

    function createStatusSelect(status, onChange) {
      const select = document.createElement("select");
      select.className = "status-select";
      POST_STATUSES.forEach((optionStatus) => {
        const option = document.createElement("option");
        option.value = optionStatus;
        option.textContent = optionStatus;
        option.selected = optionStatus === status;
        select.append(option);
      });
      select.addEventListener("change", () => onChange(select.value));
      return select;
    }

    function renderKanban() {
      const columns = Object.fromEntries(POST_STATUSES.map((status) => [status, []]));
      const savedPosts = loadSavedPosts().sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
      savedPosts.forEach((savedPost) => {
        columns[postStatus(savedPost.status)].push({ type: "saved", post: savedPost });
      });
      if (!currentPostId && hasDraftContent()) {
        columns[currentPostStatus].push({
          type: "draft",
          post: { name: savedPostName(getCurrentState()), status: currentPostStatus }
        });
      }

      kanbanBoard.replaceChildren();
      POST_STATUSES.forEach((status) => {
        const column = node("section", "kanban-column");
        column.append(node("h3", "kanban-column-title", status));
        const cards = node("div", "kanban-cards");
        if (!columns[status].length) {
          cards.append(node("p", "kanban-empty", "目前沒有貼文"));
        }
        columns[status].forEach(({ type, post }) => {
          const card = node("article", "kanban-card");
          card.append(node("div", "kanban-card-name", post.name));
          card.append(node("div", "kanban-card-meta", type === "draft" ? "未存檔草稿" : `存檔時間：${formatSavedTime(post.savedAt)}`));
          const actions = node("div", "kanban-card-actions");
          const openButton = node("button", "action-button small-button", type === "draft" ? "繼續編輯" : "打開");
          openButton.type = "button";
          openButton.addEventListener("click", () => {
            if (type === "saved") {
              currentPostId = post.id;
              currentPostStatus = postStatus(post.status);
              restoreState(post.state);
              saveDraft();
            }
            closeModal(kanbanModal);
          });
          const select = createStatusSelect(postStatus(post.status), (newStatus) => {
            if (type === "draft") {
              currentPostStatus = newStatus;
              saveDraft();
            } else {
              saveSavedPosts(loadSavedPosts().map((savedPost) => savedPost.id === post.id ? { ...savedPost, status: newStatus } : savedPost));
              if (currentPostId === post.id) {
                currentPostStatus = newStatus;
                saveDraft();
              }
            }
            renderKanban();
          });
          actions.append(select, openButton);
          card.append(actions);
          cards.append(card);
        });
        column.append(cards);
        kanbanBoard.append(column);
      });
    }

    function renderSavedPosts() {
      const savedPosts = loadSavedPosts().sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
      savedPostsList.replaceChildren();
      if (!savedPosts.length) {
        savedPostsList.append(node("p", "saved-post-empty", "還沒有存過貼文。"));
        return;
      }
      savedPosts.forEach((savedPost) => {
        const row = node("article", "saved-post-row");
        const details = node("div");
        details.append(node("div", "saved-post-name", savedPost.name));
        details.append(node("div", "saved-post-time", `存檔時間：${formatSavedTime(savedPost.savedAt)}`));
        const actions = node("div", "saved-post-actions");
        const openButton = node("button", "action-button small-button", "打開");
        openButton.type = "button";
        openButton.addEventListener("click", () => {
          currentPostId = savedPost.id;
          currentPostStatus = postStatus(savedPost.status);
          restoreState(savedPost.state);
          saveDraft();
          closeModal(savedPostsModal);
        });
        const deleteButton = node("button", "action-button small-button delete-button", "刪除");
        deleteButton.type = "button";
        deleteButton.addEventListener("click", () => {
          if (!window.confirm(`確定要刪除「${savedPost.name}」嗎？`)) return;
          saveSavedPosts(loadSavedPosts().filter((post) => post.id !== savedPost.id));
          if (currentPostId === savedPost.id) {
            currentPostId = null;
            saveDraft();
          }
          renderSavedPosts();
        });
        actions.append(openButton, deleteButton);
        row.append(details, actions);
        savedPostsList.append(row);
      });
    }

    function saveCurrentPost() {
      const state = getCurrentState();
      const savedAt = new Date().toISOString();
      const id = currentPostId || makePostId();
      const savedPosts = loadSavedPosts();
      const record = { id, name: savedPostName(state), savedAt, status: currentPostStatus, state };
      const index = savedPosts.findIndex((post) => post.id === id);
      if (index >= 0) savedPosts[index] = record;
      else savedPosts.push(record);
      saveSavedPosts(savedPosts);
      currentPostId = id;
      saveDraft();
      savePostButton.textContent = "✓ 已存檔";
      window.setTimeout(() => { savePostButton.textContent = "💾 存檔"; }, 1200);
    }

    function startNewPost() {
      MATERIAL_FIELDS.forEach(({ id }) => { document.getElementById(id).value = ""; });
      BRAND.platforms.forEach((platform) => {
        postByPlatform[platform] = "";
        userEdited[platform] = false;
      });
      currentPostId = null;
      currentPostStatus = "草稿";
      activePlatform = BRAND.platforms[0];
      setActivePlatform(activePlatform);
      saveDraft();
    }

    function buildPrompt() {
      const materialLines = MATERIAL_FIELDS.map(({ id, label }) => {
        const content = id === "date" ? formattedDateWithWeekday(valueOf(id)) : valueOf(id);
        return `${label}：${content || "（未填寫）"}`;
      });
      const platformNames = BRAND.platforms.join("、");
      const parts = [
        "（這段只要回覆文字，不要建立或修改任何檔案。）",
        `你是【${BRAND.name}】的小編。請照品牌規格，用素材卡的內容，寫【${platformNames}】的貼文，每個平台一篇。`,
        "素材卡上沒有的事不要寫；只能在某個平台說的，只寫在那個平台；先不要講的，每一篇都不能寫；還不確定的不要寫，寫完列出來問我。",
        "回覆格式：每個平台用【FB】【IG】【LINE】這樣的標題分開。",
        "\n品牌規格：\n" + (brandGuidelines.value.trim() || "（尚未設定）"),
        "\n素材卡：\n" + materialLines.join("\n")
      ];
      if (checklist.value.trim()) {
        parts.push("\n寫完照這張清單檢查，有 ❌ 先自己改好\n" + checklist.value.trim());
      }
      return parts.join("\n\n");
    }

    function platformForAiHeading(heading) {
      const normalized = heading.trim().toLowerCase();
      if (normalized === "fb" || normalized === "facebook") return "Facebook";
      if (normalized === "ig" || normalized === "instagram") return "Instagram";
      if (normalized === "line" || normalized === "line 官方帳號") return "LINE 官方帳號";
      if (normalized === "threads") return "Threads";
      return null;
    }

    function distributeAiResponse() {
      const response = aiResponseInput.value.trim();
      const headingPattern = /【\s*(FB|Facebook|IG|Instagram|LINE(?:\s*官方帳號)?|Threads|要問我的|要問我)\s*】/gi;
      const matches = [...response.matchAll(headingPattern)];
      const importedPlatforms = [];
      let questions = "";

      matches.forEach((match, index) => {
        const contentStart = match.index + match[0].length;
        const contentEnd = index + 1 < matches.length ? matches[index + 1].index : response.length;
        const content = response.slice(contentStart, contentEnd).trim();
        const heading = match[1].trim().toLowerCase();
        if (heading === "要問我的" || heading === "要問我") {
          questions = content;
          return;
        }
        const platform = platformForAiHeading(match[1]);
        if (platform && content) {
          postByPlatform[platform] = content;
          userEdited[platform] = true;
          importedPlatforms.push(platform);
        }
      });

      aiImportQuestions.hidden = !questions;
      aiImportQuestions.textContent = questions ? `【要問我的】\n${questions}` : "";
      if (!importedPlatforms.length) {
        aiImportStatus.textContent = "沒有辨識到可分配的貼文標題。";
        return;
      }
      postContent.value = postByPlatform[activePlatform];
      renderPreview();
      updateCharacterCount();
      saveDraft();
      aiImportStatus.textContent = `已分到：${[...new Set(importedPlatforms)].join("、")}`;
    }

    function joinParts(parts) {
      return parts.filter(Boolean).join("\n");
    }

    function createPost(platform) {
      const item = valueOf("item-name");
      const appeal = valueOf("appeal");
      const features = valueOf("features");
      const recommend = valueOf("recommend");
      const price = valueOf("price");
      const stock = valueOf("stock");
      const cta = valueOf("comment-cta");
      const address = valueOf("address");
      const date = dateText();

      if (platform === "Facebook") {
        return joinParts([item, "", appeal, "", features, "", recommend, price, stock, date, address, "", cta]);
      }
      if (platform === "LINE 官方帳號") {
        return joinParts([
          "【新品通知】" + item,
          appeal,
          "",
          features,
          recommend,
          price,
          stock,
          date,
          address,
          "",
          cta ? "👉 " + cta : ""
        ]);
      }
      if (platform === "Threads") {
        return joinParts([item, "", appeal, "", features, recommend, price, stock, date, address, "", cta]);
      }
      return joinParts([
        item,
        "",
        appeal,
        "",
        features,
        recommend,
        price,
        stock,
        date,
        address,
        "",
        cta,
        "",
        "#公仔 #娃娃 #選物店"
      ]);
    }

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function appendProfile(parent, meta) {
      const header = node("div", "social-header");
      header.append(node("div", "social-avatar", "🧸"));
      const details = node("div");
      details.append(node("div", "social-name", BRAND.name));
      details.append(node("div", "social-meta", meta));
      header.append(details);
      parent.append(header);
    }

    function appendImage(parent, type) {
      const imageArea = node("div", "platform-image " + type);
      if (imageDataUrl) {
        const image = document.createElement("img");
        image.src = imageDataUrl;
        image.alt = "已上傳的貼文圖片";
        imageArea.append(image);
      } else if (type === "fb-image") {
        imageArea.append(node("span", "hint", "尚未上傳圖片"));
      }
      if (type === "ig-image") {
        const item = valueOf("item-name");
        imageArea.append(node("div", "ig-image-title" + (!item ? " hint" : ""), item || "尚未填寫品項名稱"));
      }
      parent.append(imageArea);
    }

    function appendText(parent, className, text) {
      parent.append(node("p", className + (!text ? " hint" : ""), text || "尚未填寫貼文內容"));
    }

    function appendFacebookText(parent, text) {
      const characters = [...text];
      const canExpand = characters.length > 90;
      const visibleText = canExpand && !facebookPreviewExpanded
        ? characters.slice(0, 90).join("") + "…"
        : text;
      appendText(parent, "social-text", visibleText);
      if (!canExpand) return;
      const moreButton = node("button", "fb-more-button", facebookPreviewExpanded ? "收合" : "顯示更多");
      moreButton.type = "button";
      moreButton.addEventListener("click", () => {
        facebookPreviewExpanded = !facebookPreviewExpanded;
        renderPreview();
      });
      parent.append(moreButton);
    }

    function lineTimestamp() {
      const time = new Intl.DateTimeFormat("zh-TW", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
      return `今天 ${time}`;
    }

    function renderPreview() {
      const text = postContent.value;
      socialPreview.className = "social-preview";
      socialPreview.replaceChildren();

      if (activePlatform === "Facebook") {
        appendProfile(socialPreview, "剛剛");
        appendFacebookText(socialPreview, text);
        appendImage(socialPreview, "fb-image");
        socialPreview.append(node("div", "fb-actions", "讚　留言　分享"));
        return;
      }

      if (activePlatform === "Instagram") {
        appendProfile(socialPreview, "Instagram");
        appendImage(socialPreview, "ig-image");
        socialPreview.append(node("div", "ig-actions", "♡　💬　➤"));
        appendText(socialPreview, "social-text ig-caption", text);
        return;
      }

      if (activePlatform === "LINE 官方帳號") {
        socialPreview.classList.add("line-screen");
        const message = node("div", "line-message");
        message.append(node("div", "social-avatar", "🧸"));
        const content = node("div", "line-message-content");
        content.append(node("div", "line-bubble" + (!text ? " hint" : ""), text || "尚未填寫貼文內容"));
        content.append(node("div", "line-time", lineTimestamp()));
        message.append(content);
        socialPreview.append(message);
        return;
      }

      const post = node("div", "thread-post");
      post.append(node("div", "social-avatar", "🧸"));
      const main = node("div", "thread-main");
      const head = node("div", "thread-head");
      const author = node("div", "thread-author");
      author.append(node("div", "thread-name", BRAND.name));
      author.append(node("span", "thread-time", "剛剛"));
      head.append(author);
      head.append(node("span", "thread-logo", "@"));
      main.append(head);
      appendText(main, "social-text", text);
      const actions = node("div", "thread-actions");
      actions.append(node("span", "thread-action", "♡"));
      actions.append(node("span", "thread-action", "◯"));
      actions.append(node("span", "thread-action repost", "↻"));
      actions.append(node("span", "thread-action share", "➤"));
      main.append(actions);
      post.append(main);
      socialPreview.append(post);
    }

    function refreshPostFromMaterials() {
      facebookPreviewExpanded = false;
      BRAND.platforms.forEach((platform) => {
        if (!userEdited[platform]) postByPlatform[platform] = createPost(platform);
      });
      postContent.value = postByPlatform[activePlatform];
      renderPreview();
      updateCharacterCount();
      saveDraft();
    }

    function setActivePlatform(platform, saveCurrent = true, persistDraft = true) {
      if (saveCurrent) postByPlatform[activePlatform] = postContent.value;
      activePlatform = platform;
      postContent.value = postByPlatform[platform];
      [...tabs.children].forEach((tab) => {
        const isActive = tab.dataset.platform === platform;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-current", isActive ? "page" : "false");
      });
      renderPreview();
      updateCharacterCount();
      if (persistDraft) saveDraft();
    }

    BRAND.platforms.forEach((platform, index) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.textContent = platform;
      tab.dataset.platform = platform;
      tab.addEventListener("click", () => setActivePlatform(platform));
      tabs.appendChild(tab);
      if (index === 0) setActivePlatform(platform, true, false);
    });

    MATERIAL_FIELDS.forEach(({ id }) => {
      const field = document.getElementById(id);
      field.addEventListener("input", refreshPostFromMaterials);
      if (id !== "date") {
        field.addEventListener("focus", () => {
          activeMaterialInput = field;
          emojiStatus.textContent = "點選 Emoji，會插入目前游標位置。";
        });
      }
    });
    document.querySelectorAll("[data-emoji]").forEach((button) => {
      button.addEventListener("click", () => {
        if (!activeMaterialInput) {
          emojiStatus.textContent = "請先點選要填寫的素材欄位。";
          return;
        }
        const emoji = button.dataset.emoji;
        const start = activeMaterialInput.selectionStart ?? activeMaterialInput.value.length;
        const end = activeMaterialInput.selectionEnd ?? start;
        activeMaterialInput.value = activeMaterialInput.value.slice(0, start) + emoji + activeMaterialInput.value.slice(end);
        const cursor = start + emoji.length;
        activeMaterialInput.focus();
        activeMaterialInput.setSelectionRange(cursor, cursor);
        activeMaterialInput.dispatchEvent(new Event("input", { bubbles: true }));
        emojiStatus.textContent = `已插入 ${emoji}`;
      });
    });
    postContent.addEventListener("input", () => {
      if (activePlatform === "Facebook") facebookPreviewExpanded = false;
      userEdited[activePlatform] = true;
      postByPlatform[activePlatform] = postContent.value;
      renderPreview();
      updateCharacterCount();
      saveDraft();
    });

    imageUpload.addEventListener("change", () => {
      const file = imageUpload.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        imageDataUrl = reader.result;
        renderPreview();
      });
      reader.readAsDataURL(file);
    });

    settingsButton.addEventListener("click", () => openModal(settingsModal));
    kanbanButton.addEventListener("click", () => {
      renderKanban();
      openModal(kanbanModal);
    });
    aiImportButton.addEventListener("click", () => {
      aiImportStatus.textContent = "";
      aiImportQuestions.hidden = true;
      openModal(aiImportModal);
      aiResponseInput.focus();
    });
    document.getElementById("distribute-ai-response-button").addEventListener("click", distributeAiResponse);
    savedPostsButton.addEventListener("click", () => {
      renderSavedPosts();
      openModal(savedPostsModal);
    });
    newPostButton.addEventListener("click", startNewPost);
    savePostButton.addEventListener("click", saveCurrentPost);
    document.getElementById("save-settings-button").addEventListener("click", () => {
      localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify({
        brandGuidelines: brandGuidelines.value,
        checklist: checklist.value
      }));
      closeModal(settingsModal);
    });
    document.getElementById("compose-prompt-button").addEventListener("click", () => {
      promptOutput.value = buildPrompt();
      copyStatus.textContent = "";
      openModal(promptModal);
    });
    document.getElementById("copy-prompt-button").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(promptOutput.value);
        copyStatus.textContent = "已複製！";
      } catch {
        promptOutput.focus();
        promptOutput.select();
        copyStatus.textContent = "請按 Ctrl+C 複製";
      }
    });
    document.querySelectorAll("[data-close-modal]").forEach((button) => {
      button.addEventListener("click", () => closeModal(document.getElementById(button.dataset.closeModal)));
    });
    [settingsModal, promptModal, aiImportModal, savedPostsModal, kanbanModal].forEach((modal) => {
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal(modal);
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") [settingsModal, promptModal, aiImportModal, savedPostsModal, kanbanModal].forEach(closeModal);
    });

    loadSettings();
    if (!loadDraft()) refreshPostFromMaterials();
  </script>
</body>
</html>
